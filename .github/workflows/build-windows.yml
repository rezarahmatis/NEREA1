name: Build Windows

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  build:
    name: Build, publish and package NEREA
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF.Substring(11)
          } else {
            $v = "1.0.${env:GITHUB_RUN_NUMBER}"
          }
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore NuGet packages
        run: dotnet restore src/NEREA.App/NEREA.App.csproj

      # MSBuild is used instead of "dotnet build": the WinUI 3 XAML compiler
      # intermittently fails under the dotnet CLI host with MSB3073 and no
      # error details (microsoft-ui-xaml#11183), while MSBuild succeeds.
      - name: Publish self-contained x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\logs" | Out-Null
          msbuild src\NEREA.App\NEREA.App.csproj /t:Publish /m /nologo /verbosity:minimal `
            /p:Configuration=${{ env.CONFIGURATION }} /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:WindowsAppSDKSelfContained=true `
            /p:PublishDir="${{ github.workspace }}\publish\" `
            /bl:"${{ github.workspace }}\logs\publish.binlog"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify publish output
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ github.workspace }}\publish\NEREA.exe")) {
            Write-Error "NEREA.exe missing from publish output"
          }

      # The WinUI XAML compiler hides real errors behind MSB3073; the actual
      # messages live in output.json inside obj. Print them in the log and
      # upload everything (incl. the MSBuild binary log) for offline viewing.
      - name: Dump XAML compiler diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Path src -Recurse -Filter output.json -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "=== $($_.FullName) ==="
              Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue
            }

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          if-no-files-found: ignore
          path: |
            logs/
            **/obj/**/*.json

      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ github.workspace }}\publish\*" `
            -DestinationPath "${{ github.workspace }}\artifacts\NEREA-win-x64.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer (NEREA-Setup.exe)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc /DAppVersion=${{ steps.version.outputs.value }} `
            /DPublishDir="${{ github.workspace }}\publish" `
            /O"${{ github.workspace }}\artifacts" `
            installer\NEREA.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NEREA-win-x64
          path: artifacts/NEREA-win-x64.zip

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NEREA-Setup
          path: artifacts/NEREA-Setup.exe

      - name: Attach release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF.Substring(10)
          gh release create $tag --title "NEREA $tag" --generate-notes `
            "artifacts/NEREA-win-x64.zip" "artifacts/NEREA-Setup.exe"
