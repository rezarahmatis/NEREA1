name: Build Windows

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  build:
    name: Build, publish and package NEREA
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF.Substring(11)
          } else {
            $v = "1.0.${env:GITHUB_RUN_NUMBER}"
          }
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore NuGet packages
        run: dotnet restore src/NEREA.App/NEREA.App.csproj

      - name: Build solution
        run: dotnet build NEREA.sln -c ${{ env.CONFIGURATION }} -p:Platform=x64 --no-restore

      - name: Publish self-contained x64
        run: >
          dotnet publish src/NEREA.App/NEREA.App.csproj
          -c ${{ env.CONFIGURATION }}
          -r win-x64
          --self-contained true
          -p:Platform=x64
          -p:PublishDir=${{ github.workspace }}\publish\
          --no-build

      - name: Verify publish output
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ github.workspace }}\publish\NEREA.exe")) {
            Write-Error "NEREA.exe missing from publish output"
          }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ github.workspace }}\publish\*" `
            -DestinationPath "${{ github.workspace }}\artifacts\NEREA-win-x64.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer (NEREA-Setup.exe)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc /DAppVersion=${{ steps.version.outputs.value }} `
            /DPublishDir="${{ github.workspace }}\publish" `
            /O"${{ github.workspace }}\artifacts" `
            installer\NEREA.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NEREA-win-x64
          path: artifacts/NEREA-win-x64.zip

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NEREA-Setup
          path: artifacts/NEREA-Setup.exe

      - name: Attach release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF.Substring(10)
          gh release create $tag --title "NEREA $tag" --generate-notes `
            "artifacts/NEREA-win-x64.zip" "artifacts/NEREA-Setup.exe"
